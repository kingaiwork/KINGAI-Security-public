name: Private Validation Bridge Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-validation-bridge-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BRIDGE_TOKEN: ${{ secrets.GITHUBACCESSTOKENS }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record secret availability only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${BRIDGE_TOKEN:-}" ]; then status=PRESENT; else status=ABSENT; fi
          printf 'PRIVATE_VALIDATION_BRIDGE_SECRET=%s\nutc=%s\n' "$status" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > private-validation-bridge-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add private-validation-bridge-result.txt
          git commit -m 'ops: persist private validation bridge probe [skip ci]'
          git push origin HEAD:main
