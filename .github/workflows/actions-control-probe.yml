name: Public Actions Control Probe

# Temporary diagnostic generation 2.
on:
  pull_request:
    paths:
      - '.github/workflows/actions-control-probe.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-control-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove hosted runner execution
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLIC_HOSTED_ACTIONS_OK"
          uname -a
