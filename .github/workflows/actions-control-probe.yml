name: Public Actions Control Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-control-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Persist execution proof
        shell: bash
        run: |
          set -euo pipefail
          printf 'PUBLIC_HOSTED_ACTIONS_OK\ncommit=%s\nutc=%s\nrunner=%s/%s\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$RUNNER_OS" "$RUNNER_ARCH" > actions-probe-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add actions-probe-result.txt
          git commit -m 'ops: persist public Actions execution proof [skip ci]'
          git push origin HEAD:main
